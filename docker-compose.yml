version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SIMLI_API_KEY=${SIMLI_API_KEY}
      - SIMLI_FACE_ID=${SIMLI_FACE_ID}
      - NEXT_PUBLIC_PRESENTER_IMAGE_URL=${NEXT_PUBLIC_PRESENTER_IMAGE_URL}
    restart: unless-stopped