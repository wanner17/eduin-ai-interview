version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DID_API_KEY=${DID_API_KEY}
      - DID_PRESENTER_IMAGE_URL=${DID_PRESENTER_IMAGE_URL}
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL}
      - NEXT_PUBLIC_PRESENTER_IMAGE_URL=${NEXT_PUBLIC_PRESENTER_IMAGE_URL}
    restart: unless-stopped